name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-native:
    name: macOS native (universal)
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        run: chmod +x macos/scripts/*.sh

      - name: Protocol / parser tests
        run: macos/scripts/test-native.sh

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: macos/scripts/build-native.sh

      - name: Package DMG and ZIP
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: macos/scripts/package-native.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BattBar-macOS
          path: |
            release/BattBar-*-mac-universal.dmg
            release/BattBar-*-mac-universal.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  windows-legacy:
    name: Windows legacy (Electron)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run legacy tests
        run: npm test

      - name: Align Windows package version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Prepare Windows output directory
        shell: bash
        run: mkdir -p release

      - name: Build Windows installer
        shell: bash
        run: |
          set -o pipefail
          npm run pack:win 2>&1 | tee win-build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show Windows build log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::Windows build log"
          tail -120 win-build.log || true
          echo "::endgroup::"
          message="$(tail -c 1800 win-build.log | tr '\n' ' ' | tr -cd '[:print:]')"
          echo "::error title=Windows build log::$message"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BattBar-Windows
          path: |
            release/BattBar-*-win-x64.exe
            release/BattBar-*-win-x64.exe.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos-native, windows-legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          : > SHA256SUMS.txt
          for file in *.dmg *.zip *.exe *.blockmap; do
            [ -f "$file" ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
          done
          sort -k2 SHA256SUMS.txt -o SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BattBar ${{ needs.macos-native.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
