name: CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native:
    name: macOS native (universal)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x macos/scripts/*.sh

      - name: Protocol / parser tests
        run: macos/scripts/test-native.sh

      - name: Build universal app
        run: macos/scripts/build-native.sh

      - name: Package DMG and ZIP
        if: github.event_name != 'pull_request'
        run: macos/scripts/package-native.sh

      - name: Upload macOS artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BattBar-macOS
          path: |
            release/BattBar-*-mac-universal.dmg
            release/BattBar-*-mac-universal.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  windows-legacy:
    name: Windows legacy (Electron)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run legacy tests
        run: npm test

      - name: Prepare Windows output directory
        if: github.event_name != 'pull_request'
        shell: bash
        run: mkdir -p release

      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          npm run pack:win 2>&1 | tee win-build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show Windows build log on failure
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "::group::Windows build log"
          tail -120 win-build.log || true
          echo "::endgroup::"
          message="$(tail -c 1800 win-build.log | tr '\n' ' ' | tr -cd '[:print:]')"
          echo "::error title=Windows build log::$message"

      - name: Upload Windows artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BattBar-Windows
          path: |
            release/BattBar-*-win-x64.exe
            release/BattBar-*-win-x64.exe.blockmap
          if-no-files-found: error
